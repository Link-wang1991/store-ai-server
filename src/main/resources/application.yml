server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: store-ai-server
  # 生产环境必须显式设置 SPRING_PROFILES_ACTIVE=prod；演示数据仅在 dev profile 下初始化。
  # 容器/K8s 部署时由环境变量注入，见 deploy/.env.example。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://rm-bp16c2h5tv22r0ckhko.mysql.rds.aliyuncs.com:3306/store-ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mianjen}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 61MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.storeai.*.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ⚠️ JWT 密钥属敏感凭据，禁止写死。必须由环境变量 JWT_SECRET 注入。
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:604800000}

# 免密角色体验默认关闭。仅本机 local profile 可显式打开，且永不应在公网部署中开启。
app:
  local-preview-login:
    enabled: ${LOCAL_PREVIEW_LOGIN_ENABLED:false}
    owner-email: ${LOCAL_PREVIEW_OWNER_EMAIL:owner@demo.com}
  # 短信验证码下发。mode=mock 仅打印到日志并回传 devCode，供联调；生产用 mode=aliyun。
  # ⚠️ 阿里云 AccessKey 属敏感凭据，禁止写死到本文件。请通过环境变量注入：
  #   ALIYUN_SMS_ACCESS_KEY_ID / ALIYUN_SMS_ACCESS_KEY_SECRET / ALIYUN_SMS_SIGN_NAME / ALIYUN_SMS_TEMPLATE_CODE
  sms:
    mode: ${SMS_MODE:aliyun}
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
      # 模板变量须为 ${code}；可只配通用 template-code，也可按业务单独覆盖。
      # 验证码模板：您的验证码为：${code}，该验证码5分钟内有效，请勿泄露于他人！
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      template-code-login: ${ALIYUN_SMS_TEMPLATE_LOGIN:}
      template-code-reset-password: ${ALIYUN_SMS_TEMPLATE_RESET:}

# 文件存储。provider=local 时使用下面的本地目录（容器内请指向 PVC 挂载点 /app/uploads）。
storage:
  provider: ${STORAGE_PROVIDER:local}
  local-path: ${STORAGE_LOCAL_PATH:./uploads/meeting-audio}
  knowledge-local-path: ${STORAGE_KNOWLEDGE_LOCAL_PATH:./uploads/knowledge}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-knowledge: ${MINIO_BUCKET_KNOWLEDGE:store-knowledge}
  bucket-meeting: ${MINIO_BUCKET_MEETING:store-meeting}

# ⚠️ 大模型 API Key 属敏感凭据，禁止写死。必须由环境变量注入。
ai:
  provider: ${AI_PROVIDER:deepseek}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  qwen:
    api-key: ${QWEN_API_KEY:}
    text-model: ${QWEN_TEXT_MODEL:qwen-plus}
    vision-model: ${QWEN_VISION_MODEL:qwen-vl-plus}
    asr-api-url: ${QWEN_ASR_API_URL:https://dashscope.aliyuncs.com/api/v1/services/audio/asr/asynctask}

# 会谈自动重试次数。临时设为 1 以关闭自动重试（失败一次即进入失败态，不再自动重试，
# 避免语音识别/分析反复调用外部服务消耗 token/费用）；恢复自动重试时改回 3/4 并重启。
meeting:
  # ASR 语音识别提交的最大尝试次数（默认 4）
  asr-max-submit-attempts: ${MEETING_ASR_MAX_SUBMIT_ATTEMPTS:1}
  # AI 会谈分析的最大尝试次数（默认 3）
  analysis-max-attempts: ${MEETING_ANALYSIS_MAX_ATTEMPTS:1}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 微信小程序登录（一键登录 + 绑定手机号）。
# appid 为公开信息可保留默认值；secret 属敏感凭据，必须由环境变量 WX_SECRET 注入。
wx:
  appid: ${WX_APPID:wx6ade085c48e2a736}
  secret: ${WX_SECRET:}
